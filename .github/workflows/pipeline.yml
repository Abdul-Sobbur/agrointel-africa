name: Earth Engine pipeline

on:
  schedule:
    - cron: "17 5 * * 1"   # every Monday 05:17 UTC
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Ignore cached history and rebuild everything"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - name: Install
        run: pip install -r pipelines/requirements.txt
      - name: Unit tests
        run: python -m pytest -q pipelines/tests
      - name: Check credentials
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$EE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Add the EE_SERVICE_ACCOUNT_KEY secret first (see docs/SETUP.md)."
            exit 1
          fi
      - name: Run pipeline
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          EE_PROJECT: ${{ vars.EE_PROJECT || 'ee-aasobbur' }}
        run: python pipelines/run_pipeline.py ${{ inputs.rebuild && '--rebuild' || '' }}
      - name: Commit results
        run: |
          git config user.name "agrointel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache web/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%d)"
          git push
